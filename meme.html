<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Decision Support Tool</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="meme-page">
    <section class="sequence-card" id="sequenceCard">
      <h1 id="sequenceText">...</h1>
    </section>

    <section class="meme-card hidden" id="memeCard">
      <img
        id="randomMeme"
        class="meme-image"
        
      >

      <p class="meme-caption" id="memeCaption"></p>

      <a
        class="landing-btn primary"
        href="#"
        onclick="window.location.href='index.html?refresh=' + Date.now(); return false;">
        Back to main menu
      </a>
    </section>
  </main>

  <script>
  const sequenceCard = document.getElementById("sequenceCard");
  const sequenceText = document.getElementById("sequenceText");
  const memeCard = document.getElementById("memeCard");
  const randomMeme = document.getElementById("randomMeme");

  const memes = [
  {
    image: "Images/meme1.jpg",
    caption: "Who is gay?"
  },
  {
    image: "Images/meme2.jpg",
    caption: "This outcome was entirely preventable."
  },
  {
    image: "Images/meme3.jpg",
    caption: "And yet you pressed it anyway."
  },
  {
    image: "Images/meme4.jpg",
    caption: "Decision-making skills: questionable."
  },
  {
    image: "Images/meme5.jpg",
    caption: "The system is disappointed but unsurprised."
  }
];

const chosenMeme =
  memes[Math.floor(Math.random() * memes.length)];

randomMeme.src = chosenMeme.image;

document.getElementById("memeCaption").textContent =
  chosenMeme.caption;

  // Load it before the reveal

  function updateSequenceText(text) {
    sequenceText.style.animation = "none";
    void sequenceText.offsetWidth;

    sequenceText.textContent = text;
    sequenceText.style.animation =
      "sequenceFade 350ms ease";
  }

  setTimeout(() => {
    updateSequenceText("Seriously?");
  }, 1000);

  setTimeout(() => {
    updateSequenceText(
      "I literally told you not to press it."
    );
  }, 2000);

  setTimeout(() => {
    sequenceCard.classList.add("hidden");
    memeCard.classList.remove("hidden");
  }, 4000);
</script>
</body>
</html>
