<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Date Generator</title>

  <link rel="stylesheet" href="dates.css">
</head>

<body>

<main class="date-page">

  <section class="date-card">

    <div id="dateSetup">

      <p class="eyebrow">
        Date Department
      </p>

      <h1>What are we doing?</h1>

      <p class="intro">
        Provide operational constraints.
      </p>

      <div class="filter-group">
        <label for="energyFilter">
          ⚡ Energy
        </label>

        <select id="energyFilter">
          <option value="Any">Anything</option>
          <option value="Potato">🥔 Potato</option>
          <option value="Low Energy">😌 Low energy</option>
          <option value="Normal Human">⚡ Normal human</option>
          <option value="High Energy">🔥 We have PLANS</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="budgetFilter">
          💰 Budget
        </label>

        <select id="budgetFilter">
          <option value="Any">Anything</option>
          <option value="Free">Free</option>
          <option value="Cheap">Cheap</option>
          <option value="Medium">Medium</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="locationFilter">
          📍 Location
        </label>

        <select id="locationFilter">
          <option value="Any">Anywhere</option>
          <option value="Home">🏠 Home</option>
          <option value="Outside">🌳 Outside</option>
        </select>
      </div>

      <button
        class="primary-button"
        id="generateDate"
        type="button"
      >
        🎲 Generate date
      </button>

    </div>

    <section
      class="date-result hidden"
      id="dateResult"
    >

      <div
        class="date-emoji"
        id="dateEmoji"
      >
        💙
      </div>

      <p class="result-label">
        DATE ASSIGNMENT
      </p>

      <h2 id="dateTitle"></h2>

      <p
        class="date-description"
        id="dateDescription"
      ></p>

      <div
        class="date-tags"
        id="dateTags"
      ></div>

      <div class="date-actions">

        <button
          class="date-action-btn save"
          id="saveDateButton"
          type="button"
        >
          ♡ Save this one
        </button>

        <button
          class="date-action-btn complete"
          id="completeDateButton"
          type="button"
        >
          ✓ We did this!
        </button>

      </div>

      <button
        class="secondary-button"
        id="rerollDate"
        type="button"
      >
        🎲 Absolutely not. Again.
      </button>

      <button
        class="text-button"
        id="changeFilters"
        type="button"
      >
        Change filters
      </button>

    </section>

    <p
      class="no-results hidden"
      id="noResults"
    >
      Nothing survived those requirements.
      Your standards are unreasonable.
    </p>

    <nav class="bottom-nav">

      <a href="saved.html">
        ❤️ Saved
      </a>

      <a href="activities.html">
        ← Activities
      </a>

    </nav>

  </section>

</main>
<!-- =====================================
     UNAUTHORISED THOMAS INTERVENTION
===================================== -->

<div
  class="thomas-event hidden"
  id="thomasEvent"
>
  <div class="thomas-warning-screen">

    <p class="thomas-system-label">
      ⚠ UNEXPECTED SYSTEM EVENT
    </p>

    <h2 id="thomasWarningText">
      Please stand clear of the tracks.
    </h2>

    <div class="thomas-track">
      <img
        src="../Images/thomas.jpg"
        alt="Thomas"
        class="thomas-train"
        id="thomasTrain"
      >
    </div>

  </div>
</div>


<script src="../achievements.js"></script>
<script src="activities-data.js"></script>
<script src="dates.js"></script>

</body>
</html>
