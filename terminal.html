<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Message Terminal — Isabelle's Complaining area</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="terminal-page">
    <section class="terminal-card">
      

      <h2>Please start complaining</h2>

      <form
        class="message-form"
        id="messageForm"
        action="https://formspree.io/f/mvkppenv"
        method="POST"
      >
        <label for="category">Transmission type</label>

        <select id="category" name="category" required>
          <option value="General transmission">
            General transmission ⚙️
          </option>

          <option value="Bug report">
            Bug report 🐞
          </option>

          <option value="Feature request">
            Feature request ✨
          </option>

          <option value="Girlfriend complaint">
            Girlfriend complaint 😠
          </option>

          <option value="Emergency affection request">
            Affection request 🫂
          </option>
        </select>

        <label for="message">Message</label>

        <textarea
          id="message"
          name="message"
          rows="7"
          maxlength="1000"
          placeholder="Enter transmission..."
          required
        ></textarea>

        <p class="character-count">
          <span id="characterCount">0</span>/1000
        </p>

        <button class="landing-btn primary" type="submit">
          Send transmission
        </button>
      </form>

      <section class="transmission-success hidden" id="successMessage">
        <div class="terminal-status">✓</div>

        <h2>Transmission received.</h2>

        <p>
          The German girlfriend has been notified.
        </p>

        <a class="landing-btn primary" href="index.html">
          Return to main menu
        </a>
      </section>

      <p class="form-error hidden" id="formError">
        Transmission failed. Please try again.
      </p>

      <a class="back-link" href="index.html">
        ← Cancel transmission
      </a>
    </section>
  </main>

<script src="achievements.js"></script>

<script>
  const form = document.getElementById("messageForm");
  const message = document.getElementById("message");
  const characterCount = document.getElementById("characterCount");
  const successMessage = document.getElementById("successMessage");
  const formError = document.getElementById("formError");

  message.addEventListener("input", () => {
    characterCount.textContent = message.value.length;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const submitButton =
      form.querySelector('button[type="submit"]');

    submitButton.disabled = true;
    submitButton.textContent = "Encrypting...";

    formError.classList.add("hidden");
    if (selectedCategory === "Emergency affection request") {
     unlockAchievement("affection-required");
    }

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Transmission failed");
      }

      form.classList.add("hidden");
      successMessage.classList.remove("hidden");

      unlockAchievement("mail-time");

      const transmissionCount =
        incrementStatistic("transmissionCount");

      if (transmissionCount >= 5) {
        unlockAchievement("frequent-transmitter");
      }
    } catch (error) {
      formError.classList.remove("hidden");

      submitButton.disabled = false;
      submitButton.textContent = "Send transmission";

      console.error(error);
    }
  });

</script>
</body>
</html>
