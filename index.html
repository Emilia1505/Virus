<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Decision Support Tool</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="landing-page">
    <section class="landing-card">
      <p class="eyebrow">Isabelles corner</p>

      <h1>Welcome.</h1>

      <p class="intro">
        Please choose one of the following options.
      </p>

      <div class="landing-actions">
        <a class="landing-btn primary" href="proposal.html">
          You know where this leads you
        </a>

        <a class="landing-btn danger" href="meme.html">
         Do not press me
        </a>
      </div>
    </section>
  </main>

<!-- Small message button -->
<button
  class="letter-button"
  id="letterButton"
  type="button"
  aria-label="Open message"
>
  ✉️
  <span class="letter-notification"></span>
</button>

<!-- Message popup -->
<div class="letter-overlay hidden" id="letterOverlay">
  <section class="letter-card" role="dialog" aria-modal="true">
    <button
      class="letter-close"
      id="letterClose"
      type="button"
      aria-label="Close message"
    >
      ×
    </button>

    <p class="eyebrow">Incoming message</p>

    <h1>Wizard Stick</h1>

    <div class="letter-content">
      <p>I miss you loads.</p>

      <p>
        Hope you love Italy as much as I do. 💙
      </p>
    </div>

    <button
      class="landing-btn primary"
      id="letterCloseButton"
      type="button"
    >
      Message received
    </button>
  </section>
</div>

<script>
  const letterButton =
    document.getElementById("letterButton");

  const letterOverlay =
    document.getElementById("letterOverlay");

  const letterClose =
    document.getElementById("letterClose");

  const letterCloseButton =
    document.getElementById("letterCloseButton");

  function openLetter() {
    letterOverlay.classList.remove("hidden");
    document.body.classList.add("modal-open");
  }

  function closeLetter() {
    letterOverlay.classList.add("hidden");
    document.body.classList.remove("modal-open");
  }

  letterButton.addEventListener("click", openLetter);
  letterClose.addEventListener("click", closeLetter);
  letterCloseButton.addEventListener("click", closeLetter);

  letterOverlay.addEventListener("click", (event) => {
    if (event.target === letterOverlay) {
      closeLetter();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (
      event.key === "Escape" &&
      !letterOverlay.classList.contains("hidden")
    ) {
      closeLetter();
    }
  });
</script>  
</body>

</html>
