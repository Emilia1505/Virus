<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Question</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card" id="questionCard">
      <p class="eyebrow">A very serious question</p>
      <h1>Will you be my girlfriend?</h1>

      <p class="intro">
        Please answer carefully. The website may be slightly biased.
      </p>

      <div class="photo-grid">
        <img src="images/photo1.jpg" alt="">
        <img src="images/photo2.jpg" alt="">
        <img src="images/photo3.jpg" alt="">
      </div>

      <div class="button-stage" id="buttonStage">
        <button class="btn yes" id="yesBtn">Yes</button>
        <button class="btn no" id="noBtn">No</button>
      </div>

      <p class="hint" id="hintText">Take your time.</p>
    </section>

    <section class="card success hidden" id="successCard">
      <p class="eyebrow">Good choice</p>
      <h1>Okay, perfect.</h1>
      <p class="intro">
        I’m really happy you said yes.
      </p>

      <button class="btn yes" id="restartBtn">Replay</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
