<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >



  <link rel="stylesheet" href="style.css">
</head>

<body class="profile-body">

  <main class="profile-page">

    <section class="profile-card">

      <!-- Profile header -->
      <header class="profile-header">
        <div class="profile-avatar">I</div>

        <div class="profile-identity">
          <p class="profile-label">User profile</p>

          <h1>Isabelle</h1>

          <p id="profileLevel">
            Level 1 New User
          </p>
        </div>
      </header>

      <!-- Achievement progress -->
      <section class="progress-section">
        <div class="progress-heading">
          <div>
            <p class="section-label">
              Achievement progress
            </p>

            <strong id="achievementProgress">
              Loading...
            </strong>
          </div>

          <span
            class="progress-percent"
            id="progressPercent"
          >
            0%
          </span>
        </div>

        <div class="achievement-progress-bar">
          <div
            class="achievement-progress-fill"
            id="achievementProgressFill"
          ></div>
        </div>
      </section>

      <!-- Achievement list -->
      <section class="achievement-section">
        <div class="section-heading">
          <h2>Achievements</h2>

          <span id="unlockedCount">
            0 unlocked
          </span>
        </div>

        <div
          class="compact-achievement-list"
          id="achievementList"
        ></div>
      </section>

      <!-- Home button -->
      <a
        class="landing-btn primary profile-home"
        href="index.html"
      >
        Back to main menu
      </a>

    </section>
    <!-- profile-card ends here -->

  </main>
  <!-- Thomas Achievement Inspector -->
    <div
      class="achievement-thomas hidden"
      id="achievementThomas"
      aria-hidden="true"
    >
      <div class="achievement-thomas-bubble">
        Tickets, please. OR BOOOOOOOOOOOOOOOOOOOOOOOBS. 
      </div>

      <img
        src="Images/thomas.jpg"
        alt=""
        class="achievement-thomas-image"
      >
    </div>

  <script src="achievements.js"></script>

  <script>
    const achievementList =
      document.getElementById("achievementList");

    const achievementProgress =
      document.getElementById("achievementProgress");

    const achievementProgressFill =
      document.getElementById("achievementProgressFill");

    const progressPercent =
      document.getElementById("progressPercent");

    const unlockedCount =
      document.getElementById("unlockedCount");

    const profileLevel =
      document.getElementById("profileLevel");

    const unlocked = getUnlockedAchievements();

    const unlockedTotal = ACHIEVEMENTS.filter(
      (achievement) =>
        unlocked.includes(achievement.id)
    ).length;

    const totalAchievements = ACHIEVEMENTS.length;

    const percentage = Math.round(
      (unlockedTotal / totalAchievements) * 100
    );

    achievementProgress.textContent =
      `${unlockedTotal} / ${totalAchievements} unlocked`;

    unlockedCount.textContent =
      `${unlockedTotal} unlocked`;

    progressPercent.textContent =
      `${percentage}%`;

    achievementProgressFill.style.width =
      `${percentage}%`;
    if (unlockedTotal >= 30) {
     profileLevel.textContent =
    "Level 7 System Administrator";
    } else if (unlockedTotal >= 24) {
      profileLevel.textContent =
      "Level 6 Completionist";
    } else if (unlockedTotal >= 19) {
      profileLevel.textContent =
      "Level 5 Senior Investigator";
    } else if (unlockedTotal >= 14) {
      profileLevel.textContent =
        "Level 4 Investigator";
    } else if (unlockedTotal >= 10) {
      profileLevel.textContent =
        "Level 3 Explorer";
    } else if (unlockedTotal >= 6) {
      profileLevel.textContent =
        "Level 2 Curious User";
    } else {
      profileLevel.textContent =
        "Level 1 New User";
    }

    ACHIEVEMENTS.forEach((achievement) => {
      const isUnlocked =
        unlocked.includes(achievement.id);

      const item =
        document.createElement("article");

      item.className =
        `compact-achievement ${
          isUnlocked ? "unlocked" : "locked"
        }`;

      item.dataset.achievementId = achievement.id;

      if (isUnlocked) {
        item.innerHTML = `
          <div class="compact-achievement-icon">
            ${achievement.icon}
          </div>

          <div class="compact-achievement-text">
            <h3>${achievement.title}</h3>
            <p>${achievement.description}</p>
          </div>

          <span
            class="achievement-state"
            aria-label="Unlocked"
          >
            ✓
          </span>
        `;
      } else {
        item.innerHTML = `
          <div
            class="compact-achievement-icon locked-icon"
          >
            ?
          </div>

          <div class="compact-achievement-text">
            <h3>???</h3>
            <p>Unlock requirement unknown.</p>
          </div>

          <span
            class="achievement-state locked-state"
            aria-label="Locked"
          >
            🔒
          </span>
        `;
      }

      achievementList.appendChild(item);
    });
    /* ========================================
   THOMAS ACHIEVEMENT INSPECTION
   ======================================== */

    const achievementThomas =
      document.getElementById("achievementThomas");

    const alreadyInspected =
      isAchievementUnlocked("achievement-inspector");

    /*
    * More likely until she discovers it.
    * Afterwards Thomas becomes considerably rarer.
    */
    const inspectionChance = 
      alreadyInspected ? 0.03 : 0.12;

    if (Math.random() < inspectionChance) {
      setTimeout(() => {
        runAchievementInspection();
      }, 1800);
    }

    function runAchievementInspection() {

      /* Only inspect achievements she has actually earned */
      const unlockedCards = [
        ...document.querySelectorAll(
          ".compact-achievement.unlocked"
        )
      ].filter((card) =>
        card.dataset.achievementId !==
          "achievement-inspector"
      );

      if (unlockedCards.length === 0) {
        return;
      }

      const inspectedCard =
        unlockedCards[
          Math.floor(Math.random() * unlockedCards.length)
        ];

      /*
      * Save the original card so we can restore it.
      */
      const originalHTML =
        inspectedCard.innerHTML;

      inspectedCard.classList.add(
        "under-inspection"
      );

      inspectedCard.innerHTML = `
        <div class="compact-achievement-icon">
          🚂
        </div>

        <div class="compact-achievement-text">
          <h3>Achievement Under Review</h3>

          <p>
            Thomas is currently verifying this achievement.
          </p>
        </div>

        <span class="achievement-state">
          ?
        </span>
      `;

      achievementThomas.classList.remove(
        "hidden"
      );

      /*
      * Give her a second to realise something
      * has gone horribly wrong.
      */
      setTimeout(() => {
        achievementThomas.classList.add(
          "inspecting"
        );
      }, 1600);

      /*
      * Inspection complete.
      */
      setTimeout(() => {

        achievementThomas.classList.remove(
          "inspecting"
        );

        achievementThomas.classList.add(
          "hidden"
        );

        inspectedCard.innerHTML =
          originalHTML;

        inspectedCard.classList.remove(
          "under-inspection"
        );

        unlockAchievement(
          "achievement-inspector"
        );

      }, 3800);
    }
  </script>

</body>
</html>
